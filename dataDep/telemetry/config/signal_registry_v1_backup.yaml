    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 600.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Left rear brake temperature"
    
  - name: "BrkTempRR"
    display_name: "Brake Temperature Right Rear"
    system: "Brakes"
    subsystem: "Thermal"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 600.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Right rear brake temperature"
    
  # ============================================================================
  # ELECTRICAL SYSTEM
  # ============================================================================
  
  - name: "BattVolt"
    display_name: "Battery Voltage"
    system: "Electrical"
    subsystem: "Power"
    unit: "V"
    risk_direction: "low"
    valid_states: ["Operacional", "Ralenti", "Apagada"]
    physical_min: 0.0
    physical_max: 32.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "event_detection"]
    description: "Battery voltage - electrical system health indicator"
    
  # ============================================================================
  # HYDRAULIC SYSTEM
  # ============================================================================
  
  - name: "HydOilTemp"
    display_name: "Hydraulic Oil Temperature"
    system: "Hydraulics"
    subsystem: "Temperature"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 120.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "trend_analysis"]
    description: "Hydraulic system oil temperature"
    
  - name: "HydOilPres"
    display_name: "Hydraulic Oil Pressure"
    system: "Hydraulics"
    subsystem: "Pressure"
    unit: "kPa"
