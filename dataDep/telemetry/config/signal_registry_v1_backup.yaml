# Signal Registry v1.0
# Based on data_contracts.md Section 3.1
# CAT 789C/D Mining Truck Telemetry Signals
# Updated to match actual Silver layer signal names

version: "1.1"
last_updated: "2026-05-28"

signals:
  # ============================================================================
  # ENGINE SYSTEM
  # ============================================================================
  
  - name: "EngCoolTemp"
    display_name: "Engine Coolant Temperature"
    system: "Engine"
    subsystem: "Cooling"
    unit: "°C"
    risk_direction: "high"  # High values = risk
    valid_states: ["Operacional", "Ralenti"]
    physical_min: 0.0
    physical_max: 150.0
    criticality: 3  # 1=low, 2=medium, 3=high
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Engine coolant temperature - critical for thermal management"
    
  - name: "EngOilPres"
    display_name: "Engine Oil Pressure"
    system: "Engine"
    subsystem: "Lubrication"
    unit: "kPa"
    risk_direction: "low"  # Low values = risk
    valid_states: ["Operacional", "Ralenti"]
    physical_min: 0.0
    physical_max: 800.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Engine oil pressure - critical for engine protection"
    
  - name: "EngOilTemp"
    display_name: "Engine Oil Temperature"
    system: "Engine"
    subsystem: "Lubrication"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional", "Ralenti"]
    physical_min: 0.0
    physical_max: 150.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "trend_analysis"]
    description: "Engine oil temperature"
    
  - name: "EngSpeed"
    display_name: "Engine Speed"
    system: "Engine"
    subsystem: "Performance"
    unit: "RPM"
    risk_direction: "both"  # High or low can indicate issues
    valid_states: ["Operacional", "Ralenti"]
    physical_min: 0.0
    physical_max: 2500.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "event_detection"]
    description: "Engine rotational speed"
    
  - name: "TCOutTemp"
    display_name: "Turbo Charger Outlet Temperature"
    system: "Engine"
    subsystem: "Turbocharger"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 800.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "trend_analysis"]
    description: "Turbocharger outlet temperature"
    
  # ============================================================================
  # TRANSMISSION SYSTEM
  # ============================================================================
  
  - name: "TrnLubeTemp"
    display_name: "Transmission Lube Temperature"
    system: "Transmission"
    subsystem: "Lubrication"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 150.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Transmission lubrication temperature - critical for transmission health"
    
  - name: "TrnOilPres"
    display_name: "Transmission Oil Pressure"
    system: "Transmission"
    subsystem: "Lubrication"
    unit: "kPa"
    risk_direction: "low"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 4000.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "event_detection"]
    description: "Transmission oil pressure"
    
  - name: "TrnSpeed"
    display_name: "Transmission Speed"
    system: "Transmission"
    subsystem: "Performance"
    unit: "RPM"
    risk_direction: "both"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 3000.0
    criticality: 2
    enabled_techniques: ["event_detection"]
    description: "Transmission output speed"
    
  # ============================================================================
  # BRAKE SYSTEM
  # ============================================================================
  
  - name: "BrkOilPres"
    display_name: "Brake Oil Pressure"
    system: "Brakes"
    subsystem: "Hydraulic"
