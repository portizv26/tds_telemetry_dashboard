  # ============================================================================
  # DRIVE SYSTEM
  # ============================================================================
  
  - name: "DiffOilTemp"
    display_name: "Differential Oil Temperature"
    system: "Drive"
    subsystem: "Differential"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 150.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "trend_analysis"]
    description: "Differential oil temperature"
    
  - name: "AxleOilTemp"
    display_name: "Axle Oil Temperature"
    system: "Drive"
    subsystem: "Axle"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 150.0
    criticality: 2
    enabled_techniques: ["threshold_deviation", "trend_analysis"]
    description: "Axle oil temperature"

# System criticality weights for aggregation
# Used in system/unit health calculations
system_criticality:
  Engine: 1.0        # Most critical
  Transmission: 0.9
  Brakes: 1.0        # Safety critical
  Electrical: 0.7
  Hydraulics: 0.7
  Drive: 0.8
  Cooling: 0.8
  Fuel: 0.6

# Valid operational states
operational_states:
  - "Operacional"    # Operating/productive
  - "Ralenti"        # Idle
  - "Apagada"        # Off
  - "ND"             # Not determined
