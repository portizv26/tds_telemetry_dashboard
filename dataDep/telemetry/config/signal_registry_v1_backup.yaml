    risk_direction: "low"
    valid_states: ["Operacional", "Ralenti"]
    physical_min: 0.0
    physical_max: 5000.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "event_detection"]
    description: "Brake hydraulic pressure - critical safety component"
    
  - name: "BrkTempLF"
    display_name: "Brake Temperature Left Front"
    system: "Brakes"
    subsystem: "Thermal"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 600.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Left front brake temperature"
    
  - name: "BrkTempRF"
    display_name: "Brake Temperature Right Front"
    system: "Brakes"
    subsystem: "Thermal"
    unit: "°C"
    risk_direction: "high"
    valid_states: ["Operacional"]
    physical_min: 0.0
    physical_max: 600.0
    criticality: 3
    enabled_techniques: ["threshold_deviation", "trend_analysis", "event_detection"]
    description: "Right front brake temperature"
    
  - name: "BrkTempLR"
    display_name: "Brake Temperature Left Rear"
    system: "Brakes"
